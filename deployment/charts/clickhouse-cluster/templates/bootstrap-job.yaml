{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.cluster.name }}-bootstrap
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for ClickHouse service..."
              for i in $(seq 1 120); do
                if clickhouse-client --host {{ .Values.cluster.name }} --port 9000 --user {{ .Values.bootstrap.auth.user }} --password {{ .Values.bootstrap.auth.password }} --query "SELECT 1" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              clickhouse-client --host {{ .Values.cluster.name }} --port 9000 --user {{ .Values.bootstrap.auth.user }} --password {{ .Values.bootstrap.auth.password }} --multiquery < /bootstrap/init.sql
          volumeMounts:
            - name: bootstrap-sql
              mountPath: /bootstrap
      volumes:
        - name: bootstrap-sql
          configMap:
            name: {{ .Values.cluster.name }}-bootstrap-sql
{{- end }}
