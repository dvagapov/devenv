cluster:
  name: clickhouse
  replicas: 1

keeper:
  name: clickhouse-keeper
  replicas: 1
  storage:
    storageClassName: local-path
    size: 1Gi

image:
  repository: clickhouse/clickhouse-server
  tag: "26.1-alpine"

storage:
  storageClassName: local-path
  size: 5Gi

bootstrap:
  enabled: true
  image: clickhouse/clickhouse-server:26.1-alpine
  auth:
    user: default
    password: clickhouse
  sql: |
    CREATE DATABASE IF NOT EXISTS ml;
    CREATE DATABASE IF NOT EXISTS observability;

    CREATE TABLE IF NOT EXISTS observability.vector_logs (
        timestamp DateTime64(9) DEFAULT now64(9),
        message String DEFAULT '',
        file String DEFAULT '',
        source_type LowCardinality(String) DEFAULT '',
        stream LowCardinality(String) DEFAULT '',
        pod_name String DEFAULT '',
        pod_namespace LowCardinality(String) DEFAULT '',
        container_name String DEFAULT '',
        container_image String DEFAULT '',
        node_name String DEFAULT ''
    ) ENGINE = MergeTree()
    PARTITION BY toYYYYMMDD(timestamp)
    ORDER BY (pod_namespace, pod_name, timestamp)
    TTL toDateTime(timestamp) + INTERVAL 7 DAY;

    CREATE TABLE IF NOT EXISTS observability.vector_metrics (
        timestamp DateTime64(9) DEFAULT now64(9),
        metric_name String DEFAULT '',
        metric_kind LowCardinality(String) DEFAULT '',
        metric_value Float64 DEFAULT 0,
        tags String DEFAULT '',
        source_type LowCardinality(String) DEFAULT ''
    ) ENGINE = MergeTree()
    PARTITION BY toYYYYMMDD(timestamp)
    ORDER BY (metric_name, timestamp)
    TTL toDateTime(timestamp) + INTERVAL 7 DAY;

    CREATE TABLE IF NOT EXISTS observability.analyzer_state (
        job_id String,
        run_id String,
        step String,
        status Enum8('pending' = 1, 'in_progress' = 2, 'completed' = 3, 'failed' = 4),
        checkpoint String,
        started_at DateTime,
        updated_at DateTime
    ) ENGINE = ReplacingMergeTree(updated_at)
    ORDER BY (job_id, run_id, step);

    CREATE TABLE IF NOT EXISTS observability.analyzer_reports (
        job_id String,
        run_id String,
        window_start DateTime,
        window_end DateTime,
        status LowCardinality(String),
        summary String,
        prompt String,
        model String,
        anomalies_json String,
        metrics_json String,
        created_at DateTime
    ) ENGINE = ReplacingMergeTree(created_at)
    ORDER BY (job_id, run_id);

    CREATE TABLE IF NOT EXISTS observability.analyzer_knowledge (
        job_id String,
        run_id String,
        service_name String,
        signal_type LowCardinality(String),
        insight String,
        confidence Float64,
        created_at DateTime
    ) ENGINE = MergeTree()
    ORDER BY (job_id, run_id, service_name, signal_type);
