vector:
  role: Agent
  service:
    enabled: false

  customConfig:
    data_dir: /vector-data-dir

    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      ## Automatically discovers and collects all container logs on the node
      kubernetes_logs:
        type: kubernetes_logs

      ## Scrape pods with prometheus.io/scrape=true annotations
      prometheus_scrape:
        type: prometheus_scrape
        scrape_interval_secs: 30
        endpoints:
          - http://kube-state-metrics.observability.svc.cluster.local:8080/metrics

      ## Node-level & pod-level resource metrics via kubelet
      host_metrics:
        type: host_metrics
        collectors:
          - cpu
          - memory
          - disk
          - network
        scrape_interval_secs: 30

    transforms:
      ## Enrich logs with a short message field and drop noisy keys
      parse_logs:
        type: remap
        inputs: ["kubernetes_logs"]
        source: |
          .timestamp = del(.timestamp)
          .kubernetes = del(.kubernetes)

      ## Convert metrics to logs so they can be sent to the ClickHouse sink
      metrics_to_logs:
        type: metric_to_log
        inputs: ["prometheus_scrape", "host_metrics"]

    sinks:
      ## Debug: print a sample of logs and metrics to stdout
      debug_logs:
        type: console
        inputs: ["parse_logs"]
        encoding:
          codec: json
      debug_metrics:
        type: console
        inputs: ["metrics_to_logs"]
        encoding:
          codec: json

      ## Logs → ClickHouse via HTTP (native JSON insert)
      clickhouse_logs:
        type: clickhouse
        inputs: ["parse_logs"]
        endpoint: http://clickhouse.observability.svc.cluster.local:8123
        database: observability
        table: vector_logs
        auth:
          strategy: basic
          user: default
          password: clickhouse
        skip_unknown_fields: true
        batch:
          max_bytes: 1048576
          timeout_secs: 5
        encoding:
          timestamp_format: unix

      ## Metrics (as logs) → ClickHouse
      clickhouse_metrics:
        type: clickhouse
        inputs: ["metrics_to_logs"]
        endpoint: http://clickhouse.observability.svc.cluster.local:8123
        database: observability
        table: vector_metrics
        auth:
          strategy: basic
          user: default
          password: clickhouse
        skip_unknown_fields: true
        batch:
          max_bytes: 1048576
          timeout_secs: 5
        encoding:
          timestamp_format: unix
