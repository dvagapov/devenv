{{- if .Values.initScripts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-initscripts
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.initScripts }}
  {{ $key }}: |
    {{- $value | nindent 4 }}
  {{- end }}
{{- end }}
