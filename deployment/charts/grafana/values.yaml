grafana:
  adminUser: admin
  adminPassword: admin
  plugins:
    - grafana-clickhouse-datasource
  service:
    type: ClusterIP
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: ClickHouse
          uid: clickhouse-observability
          type: grafana-clickhouse-datasource
          access: proxy
          url: http://clickhouse.observability.svc.cluster.local:8123
          jsonData:
            defaultDatabase: observability
          secureJsonData:
            password: clickhouse

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: Analyzer
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      analyzer-quality:
        json: |
          {
            "id": null,
            "uid": "analyzer-quality",
            "title": "Analyzer Prompt & Store Result Quality",
            "tags": ["analyzer", "llm", "clickhouse"],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "1m",
            "time": {
              "from": "now-24h",
              "to": "now"
            },
            "panels": [
              {
                "type": "stat",
                "title": "Runs (24h)",
                "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse-observability"},
                "targets": [
                  {
                    "refId": "A",
                    "query": "SELECT count() AS value FROM observability.analyzer_reports WHERE created_at >= now() - INTERVAL 24 HOUR"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "orientation": "auto", "colorMode": "value"}
              },
              {
                "type": "stat",
                "title": "Fallback Summaries % (24h)",
                "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse-observability"},
                "targets": [
                  {
                    "refId": "A",
                    "query": "SELECT if(count() = 0, 0, round(100.0 * countIf(model = 'local-fallback') / count(), 2)) AS value FROM observability.analyzer_reports WHERE created_at >= now() - INTERVAL 24 HOUR"
                  }
                ],
                "fieldConfig": {"defaults": {"unit": "percent"}},
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "orientation": "auto", "colorMode": "value"}
              },
              {
                "type": "stat",
                "title": "Avg Summary Length (24h)",
                "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse-observability"},
                "targets": [
                  {
                    "refId": "A",
                    "query": "SELECT toInt64(ifNull(avg(length(summary)), 0)) AS value FROM observability.analyzer_reports WHERE created_at >= now() - INTERVAL 24 HOUR"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "orientation": "auto", "colorMode": "value"}
              },
              {
                "type": "stat",
                "title": "Knowledge Rows (24h)",
                "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse-observability"},
                "targets": [
                  {
                    "refId": "A",
                    "query": "SELECT count() AS value FROM observability.analyzer_knowledge WHERE created_at >= now() - INTERVAL 24 HOUR"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "orientation": "auto", "colorMode": "value"}
              },
              {
                "type": "timeseries",
                "title": "store_result Step Status by Hour",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse-observability"},
                "targets": [
                  {
                    "refId": "A",
                    "query": "SELECT toStartOfHour(updated_at) AS time, status AS metric, count() AS value FROM observability.analyzer_state WHERE step = 'store_result' AND updated_at >= now() - INTERVAL 24 HOUR GROUP BY time, metric ORDER BY time"
                  }
                ],
                "fieldConfig": {
                  "defaults": {"unit": "short"},
                  "overrides": [
                    {
                      "matcher": {"id": "byName", "options": "failed"},
                      "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]
                    },
                    {
                      "matcher": {"id": "byName", "options": "completed"},
                      "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]
                    }
                  ]
                }
              },
              {
                "type": "table",
                "title": "Recent Analyzer Reports",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse-observability"},
                "targets": [
                  {
                    "refId": "A",
                    "query": "SELECT created_at, run_id, status, model, length(summary) AS summary_len, substring(summary, 1, 240) AS summary_preview, substring(prompt, 1, 140) AS prompt_preview FROM observability.analyzer_reports ORDER BY created_at DESC LIMIT 25"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Top Services with Learned Insights (7d)",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse-observability"},
                "targets": [
                  {
                    "refId": "A",
                    "query": "SELECT service_name, count() AS insight_count, round(avg(confidence), 3) AS avg_confidence FROM observability.analyzer_knowledge WHERE created_at >= now() - INTERVAL 7 DAY GROUP BY service_name ORDER BY insight_count DESC LIMIT 20"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Step Health (24h)",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse-observability"},
                "targets": [
                  {
                    "refId": "A",
                    "query": "SELECT step, status, count() AS rows FROM observability.analyzer_state WHERE updated_at >= now() - INTERVAL 24 HOUR GROUP BY step, status ORDER BY step, status"
                  }
                ]
              }
            ]
          }
