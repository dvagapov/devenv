{{- range .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | default "0" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.argocd.project }}
  source:
    repoURL: {{ $.Values.argocd.repoURL }}
    targetRevision: {{ $.Values.argocd.targetRevision }}
    path: {{ .path }}
    helm:
      releaseName: {{ .name }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # grafana-operator's Grafana CRD is ~700KB — client-side apply's
      # last-applied-configuration annotation has a 262144-byte cap, so it
      # silently fails to apply without this.
      - ServerSideApply=true
{{- end }}
